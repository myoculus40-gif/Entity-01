<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Etapa 1 - Lobby y locomocion</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<script>
/* ============ AJUSTES ============ */
const SPAWN = {x:0, y:0, z:5};   // punto de aparicion
const HAND_R = 0.09;             // radio de contacto de las manos
const BODY_DROP = 0.55;          // el "pecho" cuelga bajo la cabeza (altura de gorila)
const MAX_SPEED = 9;             // velocidad maxima (m/s)
const GRAVITY = 9.8;

/* ============ TEXTURA DE CONCRETO (procedural) ============ */
const SOLIDS = [];
const CONC = document.createElement('canvas');
CONC.width = CONC.height = 256;
(function(){
  const g = CONC.getContext('2d');
  g.fillStyle = '#6b6b68'; g.fillRect(0,0,256,256);
  const im = g.getImageData(0,0,256,256), d = im.data;
  for(let i=0;i<d.length;i+=4){ const n=(Math.random()-.5)*46; d[i]+=n; d[i+1]+=n; d[i+2]+=n; }
  g.putImageData(im,0,0);
  for(let i=0;i<14;i++){
    g.fillStyle='rgba(20,20,18,'+(0.05+Math.random()*0.1)+')';
    g.beginPath(); g.arc(Math.random()*256,Math.random()*256,10+Math.random()*40,0,6.3); g.fill();
  }
  g.strokeStyle='rgba(15,15,15,.5)'; g.lineWidth=1;
  for(let i=0;i<5;i++){
    g.beginPath(); let x=Math.random()*256, y=Math.random()*256; g.moveTo(x,y);
    for(let k=0;k<6;k++){ x+=(Math.random()-.5)*40; y+=(Math.random()-.5)*40; g.lineTo(x,y); }
    g.stroke();
  }
})();

/* ============ FISICA: esfera contra cajas (AABB) ============ */
const CN = new THREE.Vector3(); // normal del contacto mas profundo
function probe(px,py,pz,r){
  let best = 0;
  for(let i=0;i<SOLIDS.length;i++){
    const b = SOLIDS[i];
    const cx = Math.max(b.min.x, Math.min(px, b.max.x));
    const cy = Math.max(b.min.y, Math.min(py, b.max.y));
    const cz = Math.max(b.min.z, Math.min(pz, b.max.z));
    const dx=px-cx, dy=py-cy, dz=pz-cz, d2=dx*dx+dy*dy+dz*dz;
    if(d2 >= r*r) continue;
    let depth, nx, ny, nz;
    if(d2 > 1e-10){
      const d = Math.sqrt(d2); depth = r-d; nx=dx/d; ny=dy/d; nz=dz/d;
    } else { // centro dentro de la caja: salir por la cara mas cercana
      const f=[px-b.min.x,b.max.x-px,py-b.min.y,b.max.y-py,pz-b.min.z,b.max.z-pz];
      let k=0; for(let j=1;j<6;j++) if(f[j]<f[k]) k=j;
      depth = r+f[k]; nx=ny=nz=0;
      if(k===0) nx=-1; else if(k===1) nx=1; else if(k===2) ny=-1;
      else if(k===3) ny=1; else if(k===4) nz=-1; else nz=1;
    }
    if(depth > best){ best=depth; CN.set(nx,ny,nz); }
  }
  return best;
}

/* ============ LOBBY (geometria + colisiones) ============ */
AFRAME.registerComponent('lobby',{
  init(){
    const base = new THREE.CanvasTexture(CONC);
    base.wrapS = base.wrapT = THREE.RepeatWrapping;
    if(THREE.SRGBColorSpace) base.colorSpace = THREE.SRGBColorSpace;
    // [x, y, z, ancho, alto, fondo]  (suelo = y 0)
    const B = [
      [0,-0.5,0, 17,1,17],        // suelo
      [0,4.25,0, 17,0.5,17],      // techo
      [0,2,-8.25, 17,4,0.5],      // pared norte
      [0,2,8.25, 17,4,0.5],       // pared sur
      [-8.25,2,0, 0.5,4,17],      // pared oeste
      [8.25,2,0, 0.5,4,17],       // pared este
      [-3,2,-3, 0.8,4,0.8],       // pilares
      [3,2,-3, 0.8,4,0.8],
      [-3,2,3, 0.8,4,0.8],
      [3,2,3, 0.8,4,0.8],
      [0,0.25,0, 2,0.5,0.6],      // banca central
      [5.5,0.5,5.5, 1,1,1],       // cajas para trepar
      [5.5,1.5,5.5, 1,1,1],
      [6.6,0.4,5.5, 0.8,0.8,0.8],
      [7.2,1.2,-3, 1.6,0.3,6],    // repisa baja
      [7.2,2.5,-3, 1.6,0.3,6],    // repisa alta
      [-6,1,-1, 0.6,2,3]          // muro bajo
    ];
    for(const [x,y,z,w,h,d] of B){
      const t = base.clone(); t.needsUpdate = true;
      t.repeat.set(Math.max(w,d)/3, Math.max(h,Math.min(w,d))/3);
      const m = new THREE.Mesh(
        new THREE.BoxGeometry(w,h,d),
        new THREE.MeshStandardMaterial({map:t, color:0xb0b0b0, roughness:1, metalness:0})
      );
      m.position.set(x,y,z);
      this.el.object3D.add(m);
      SOLIDS.push({min:new THREE.Vector3(x-w/2,y-h/2,z-d/2), max:new THREE.Vector3(x+w/2,y+h/2,z+d/2)});
    }
    // puerta de escaleras (solo visual por ahora, Etapa 2)
    const door = new THREE.Mesh(new THREE.BoxGeometry(2.4,2.6,0.1), new THREE.MeshBasicMaterial({color:0x000000}));
    door.position.set(0,1.3,-7.95);
    this.el.object3D.add(door);
  }
});

/* ============ MANOS (esferas oscuras) ============ */
AFRAME.registerComponent('hand-body',{
  init(){
    const m = new THREE.Mesh(
      new THREE.SphereGeometry(0.07,12,8),
      new THREE.MeshStandardMaterial({color:0x151515, emissive:0x2a2a2a, roughness:.8})
    );
    this.el.object3D.add(m);
  }
});

/* ============ LUZ FLUORESCENTE QUE PARPADEA ============ */
AFRAME.registerComponent('flicker',{
  schema:{base:{default:12}},
  init(){ this.off = 0; },
  tick(t){
    const l = this.el.components.light; if(!l || !l.light) return;
    if(Math.random() < 0.004) this.off = t + 60 + Math.random()*140;
    const k = (t < this.off) ? 0.15 : (0.95 + Math.sin(t*0.02)*0.05);
    l.light.intensity = this.data.base * k;
  }
});

/* ============ LOCOMOCION TIPO GORILLA TAG ============ */
AFRAME.registerComponent('gorilla-loco',{
  init(){
    this.hands = [this.el.querySelector('#lh'), this.el.querySelector('#rh')];
    this.cam = this.el.querySelector('#head');
    this.grip = [false,false];
    this.prev = [new THREE.Vector3(), new THREE.Vector3()];
    this.vel = new THREE.Vector3();
    this.d = new THREE.Vector3(); this.mv = new THREE.Vector3(); this.vs = new THREE.Vector3();
    this.has = false; this.placed = false;
    this.hands.forEach((h,i)=>{
      h.addEventListener('gripdown',()=>{ this.grip[i]=true; });
      h.addEventListener('gripup',()=>{ this.grip[i]=false; });
    });
    this.hands[0].addEventListener('ybuttondown',()=>this.reset());
    this.hands[1].addEventListener('bbuttondown',()=>this.reset());
  },
  reset(){
    this.el.object3D.position.set(SPAWN.x,SPAWN.y,SPAWN.z);
    this.vel.set(0,0,0); this.placed=false; this.has=false;
  },
  tick(time, dtms){
    const sc = this.el.sceneEl, rig = this.el.object3D.position;
    if(!sc.is('vr-mode')){ this.has=false; this.placed=false; return; }
    const dt = Math.min(dtms/1000, 0.05); if(dt <= 0) return;
    const cp = this.cam.object3D.position;

    // al entrar a VR: apoyar el cuerpo justo sobre el suelo (sin caida inicial)
    if(!this.placed){
      if(cp.y < 0.3) return;
      rig.y = 0.02 - (cp.y - (BODY_DROP + 0.3));
      this.placed = true; this.vel.set(0,0,0); this.has = false;
    }

    // --- manos: empujar / agarrar ---
    const mv = this.mv.set(0,0,0), vs = this.vs.set(0,0,0); let n = 0;
    for(let i=0;i<2;i++){
      const lp = this.hands[i].object3D.position, pv = this.prev[i], d = this.d;
      if(!this.has){ pv.copy(lp); continue; }
      d.copy(lp).sub(pv); pv.copy(lp);
      if(d.lengthSq() > 0.25) continue; // salto de tracking: ignorar
      const depth = probe(rig.x+lp.x, rig.y+lp.y, rig.z+lp.z, HAND_R);
      if(depth > 0 && (this.grip[i] || (d.x*CN.x + d.y*CN.y + d.z*CN.z) < 0.002)){
        mv.sub(d); vs.addScaledVector(d, -1/dt); n++;
      }
    }
    this.has = true;

    if(n){
      rig.add(mv.divideScalar(n));
      this.vel.lerp(vs.divideScalar(n), 0.6);   // inercia para saltar al soltar
    } else {
      this.vel.y -= GRAVITY*dt;
      this.vel.multiplyScalar(Math.max(0, 1-0.25*dt));
    }
    if(this.vel.lengthSq() > MAX_SPEED*MAX_SPEED) this.vel.setLength(MAX_SPEED);
    if(!n) rig.addScaledVector(this.vel, dt);

    // --- cuerpo: cabeza y pecho colisionan con el mundo ---
    for(let pass=0; pass<3; pass++){
      for(let k=0;k<2;k++){
        const oy = k ? 0 : BODY_DROP, r = k ? 0.2 : 0.3; // k0 pecho, k1 cabeza
        const dep = probe(rig.x+cp.x, rig.y+cp.y-oy, rig.z+cp.z, r);
        if(dep > 0){
          rig.x += CN.x*dep; rig.y += CN.y*dep; rig.z += CN.z*dep;
          const vn = this.vel.dot(CN);
          if(vn < 0) this.vel.addScaledVector(CN, -vn);
        }
      }
    }
    if(rig.y < -30) this.reset();
  }
});
</script>
</head>
<body>
<a-scene renderer="antialias:false; foveationLevel:2"
         background="color:#040405"
         fog="type:exponential; color:#040405; density:0.045"
         webxr="referenceSpaceType:local-floor"
         vr-mode-ui="enabled:true">

  <!-- Luces (pocas, sin sombras: Quest 2). Si se ve muy oscuro/claro, cambia 'intensity'. -->
  <a-entity light="type:ambient; color:#667; intensity:2"></a-entity>
  <a-entity light="type:point; color:#cfe0c8; intensity:12; distance:14; decay:1" position="-4 3.5 -3"></a-entity>
  <a-entity light="type:point; color:#cfe0c8; intensity:12; distance:14; decay:1" position="4 3.5 3" flicker="base:12"></a-entity>
  <a-entity light="type:point; color:#b8c8d8; intensity:9; distance:12; decay:1" position="0 3.5 6"></a-entity>

  <a-entity lobby></a-entity>

  <a-text value="ETAPA 1 - LOBBY&#10;Empuja suelo y paredes con las manos&#10;Mantén GRIP para agarrarte y trepar&#10;Y / B: reaparecer"
          position="-4.2 2 -7.9" align="center" width="4" color="#8a8a86"></a-text>

  <!-- Jugador -->
  <a-entity id="rig" gorilla-loco position="0 0 5">
    <a-entity id="head" camera look-controls wasd-controls="enabled:false" position="0 1.6 0"></a-entity>
    <a-entity id="lh" oculus-touch-controls="hand:left; model:false" hand-body></a-entity>
    <a-entity id="rh" oculus-touch-controls="hand:right; model:false" hand-body></a-entity>
  </a-entity>
</a-scene>
</body>
</html>
